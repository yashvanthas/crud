{% extends "base.html" %}

{% block title %}
Edit Student
{% endblock %}

{% block content %}

<div class="card form-card">


    <div class="form-header">

        <h1>Edit Student</h1>

        <p>
            Update the student's information.
        </p>

    </div>


    <form action="/edit_student/{{ id }}" method="POST">

        <div class="form-group">

            <label for="name">
                Student Name
            </label>

            <input type="text" name="name" id="name" value="{{ name }}" required>

        </div>


        <div class="form-group">

            <label for="age">
                Age
            </label>

            <input type="number" name="age" id="age" value="{{ age }}" min="1" max="100" required>

        </div>

         <div class="form-group">

            <label for="course">
                Course
            </label>

            <input type="text" name="course" id="age" value="{{ course }}" min="1" max="100" required>

        </div>
          <div class="form-group">

            <label for="stream">
                Stream
            </label>

            <input type="text" name="stream" id="age" value="{{ stream }}" min="1" max="100" required>

        </div>


        <button type="submit" class="btn-primary">

            Update Student

        </button>

    </form>

</div>

{% endblock %}
