<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Student Management System</title>
    <!-- Google Font -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- CSS Link -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-body">

    <div class="auth-wrapper">
        <!-- System Branding/Logo Header -->
        <div class="auth-logo">
            <div class="logo-icon">S</div>
            <div>
                <span class="logo-title">Student</span>
                <span class="logo-subtitle">Management System</span>
            </div>
        </div>

        <!-- Main Form Card Container -->
        <div class="card auth-card">
            <div class="form-header">
                <h1>Welcome back</h1>
                <p>Enter your institutional credentials to access your administrative dashboard.</p>
            </div>

            <!-- Login Data Target Form -->
            <form action="/" method="POST">

                <div class="form-group">
                    <label for="username">Username or Email Address</label>
                    <input type="text" id="username" name="username" placeholder="Enter the name" requireds>
                </div>

                <div class="form-group">
                    <div class="label-wrapper">
                        <label for="password">Password</label>
                        <a href="/forgot_password" class="auth-link">Forgot password?</a>
                    </div>
                    <input type="password" id="password" name="password" placeholder="Enter the password" required>
                </div>

                <!-- Remember Me Selection utility row -->
                <div class="auth-utility-row">
                    <label class="checkbox-container">
                        <input type="checkbox" name="remember_me">
                        <span class="checkbox-checkmark"></span>
                        Remember this machine for 30 days
                    </label>
                </div>

                <button type="submit" class="btn-primary">
                    Sign In to Dashboard
                </button>
            </form>
        </div>

        <!-- Public legal Footer block -->
        <div class="auth-footer">
            <p>© 2026 Student Management System. Secure Administrative Port.</p>
        </div>
    </div>

</body>

</html>
